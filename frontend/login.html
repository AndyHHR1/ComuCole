<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComuCole - Inicio de Sesión</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <main class="login-main">
            <div class="login-card">
                <div class="login-logo">
                    <span class="logo-icon">C</span>
                    <h1 class="logo-text">ComuCole</h1>
                </div>
                <p class="login-subtitle">Plataforma de Comunicación Escolar</p>

                <div id="screen-rol" class="screen active">
                    <p class="login-hint">Selecciona tu perfil para continuar</p>
                    <div class="login-actions">
                        <button type="button" id="btn-docente" class="btn-login btn-docente">
                            <span class="btn-login-icon">👩‍🏫</span>
                            <span class="btn-login-label">Soy Docente</span>
                            <span class="btn-login-desc">Subir planificación y publicar actividades</span>
                        </button>
                        <button type="button" id="btn-padre" class="btn-login btn-padre">
                            <span class="btn-login-icon">👨‍👩‍👧</span>
                            <span class="btn-login-label">Soy Padre de Familia</span>
                            <span class="btn-login-desc">Ver la clase del día y el ranking</span>
                        </button>
                    </div>
                </div>

                <div id="screen-auth" class="screen">
                    <p class="login-hint" id="auth-hint">Inicia sesión con tu código</p>
                    <form id="form-auth" class="form-edicion" autocomplete="off">
                        <div class="form-group">
                            <label for="auth-code">Código</label>
                            <input type="text" id="auth-code" class="form-group textarea" placeholder="Ej: DOC001" required>
                        </div>
                        <div class="form-group">
                            <label for="auth-password">Contraseña</label>
                            <input type="password" id="auth-password" class="form-group textarea" placeholder="Tu contraseña" required>
                        </div>
                        <div class="form-group hidden" id="group-nombre">
                            <label for="auth-nombre">Nombre completo</label>
                            <input type="text" id="auth-nombre" class="form-group textarea" placeholder="Ej: Juan Pérez">
                        </div>
                        <div class="form-group hidden" id="group-año">
                            <label for="auth-año">Año del alumno</label>
                            <select id="auth-año" class="form-group textarea">
                                <option value="">Selecciona un año</option>
                                <option value="1">1° Año</option>
                                <option value="2">2° Año</option>
                                <option value="3">3° Año</option>
                                <option value="4">4° Año</option>
                                <option value="5">5° Año</option>
                            </select>
                        </div>
                        <div class="form-group hidden" id="group-seccion">
                            <label for="auth-seccion">Sección</label>
                            <select id="auth-seccion" class="form-group textarea">
                                <option value="">Selecciona una sección</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                            </select>
                        </div>
                        <div class="form-group hidden" id="group-color-aula">
                            <label for="auth-color-aula">Color del Aula</label>
                            <select id="auth-color-aula" class="form-group textarea">
                                <option value="">Selecciona un color</option>
                                <option value="Rojo">Rojo</option>
                                <option value="Azul">Azul</option>
                                <option value="Verde">Verde</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="button" id="btn-volver" class="btn btn-secondary">Volver</button>
                            <button type="submit" id="btn-login" class="btn btn-primary">Iniciar Sesión</button>
                            <button type="submit" id="btn-register" class="btn btn-primary hidden">Registrarse</button>
                        </div>
                        <p id="auth-error" class="error-msg hidden"></p>
                        <button type="button" id="btn-toggle-mode" class="btn-toggle-mode">¿No tienes cuenta? Regístrate</button>
                    </form>
                </div>
            </div>
        </main>

        <footer class="login-footer">
            <p>ComuCole &copy; 2025</p>
        </footer>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
